name: Code Check

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'test/**'
      - 'release/**'
      - 'fix/**'
      - 'seo/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Check browser JavaScript
        run: |
          node --check public/assets/app.js
          node --check public/assets/analytics.js
          node --check public/assets/site-shell.js
          node --check public/assets/instagram.js
      - name: Check unified navigation shell
        run: |
          set -euo pipefail
          test -f public/assets/site-shell.js
          test -f public/assets/nav.css
          grep -Fq '/assets/site-shell.js' public/assets/analytics.js
          grep -Fq 'nav-toggle' public/assets/site-shell.js
          grep -Fq "nav.classList.toggle('is-open'" public/assets/site-shell.js
          grep -Fq '.nav-toggle' public/assets/nav.css
          grep -Fq '.navlinks.is-open' public/assets/nav.css
          ! grep -Fq 'instagramLink' public/assets/site-shell.js
          nav_pages=(
            public/index.html
            public/douyin-downloader/index.html
            public/tiktok-downloader/index.html
            public/instagram-downloader/index.html
            public/guides/index.html
            public/how-to-download-douyin-videos/index.html
            public/how-to-download-douyin-short-links/index.html
            public/how-to-download-tiktok-videos/index.html
            public/how-to-download-instagram-videos-and-photos/index.html
            public/about/index.html
            public/contact/index.html
            public/privacy/index.html
            public/cookies/index.html
            public/terms/index.html
            public/copyright/index.html
          )
          for page in "${nav_pages[@]}"; do
            grep -Fq '/assets/nav.css' "$page"
            grep -Fq 'href="/douyin-downloader/"' "$page"
            grep -Fq 'href="/tiktok-downloader/"' "$page"
            grep -Fq 'href="/instagram-downloader/"' "$page"
            grep -Fq 'href="/guides/"' "$page"
            grep -Fq 'href="/about/"' "$page"
            grep -Fq 'href="/contact/"' "$page"
            grep -Fq 'class="nav-cta"' "$page"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const pages = [
            'public/index.html',
            'public/douyin-downloader/index.html',
            'public/tiktok-downloader/index.html',
            'public/instagram-downloader/index.html',
            'public/guides/index.html',
            'public/how-to-download-douyin-videos/index.html',
            'public/how-to-download-douyin-short-links/index.html',
            'public/how-to-download-tiktok-videos/index.html',
            'public/how-to-download-instagram-videos-and-photos/index.html',
            'public/about/index.html',
            'public/contact/index.html',
            'public/privacy/index.html',
            'public/cookies/index.html',
            'public/terms/index.html',
            'public/copyright/index.html'
          ];
          const order = [
            '/douyin-downloader/',
            '/tiktok-downloader/',
            '/instagram-downloader/',
            '/guides/',
            '/about/',
            '/contact/'
          ];
          for (const file of pages) {
            const html = fs.readFileSync(file, 'utf8');
            const header = html.match(/<header class="site-header">([\s\S]*?)<\/header>/)?.[1];
            if (!header) throw new Error(`${file}: missing site header`);
            let last = -1;
            for (const href of order) {
              const index = header.indexOf(`href="${href}"`);
              if (index < 0 || index <= last) throw new Error(`${file}: navigation order mismatch at ${href}`);
              last = index;
            }
            if (!header.includes('class="nav-cta"')) throw new Error(`${file}: missing Download CTA`);
          }
          const tiktok = fs.readFileSync('public/tiktok-downloader/index.html', 'utf8');
          const analyticsLoads = (tiktok.match(/src="\/assets\/analytics\.js"/g) || []).length;
          if (analyticsLoads !== 1) throw new Error(`TikTok page must load analytics.js once, found ${analyticsLoads}`);
          NODE
      - name: Check TikTok Vercel functions
        run: |
          node --check vercel-tiktok-api/api/health.js
          node --check vercel-tiktok-api/api/download.js
      - name: Check Instagram Cloudflare-only delivery
        run: |
          set -euo pipefail
          test ! -e vercel-instagram-api
          grep -Fq "'/api/download/instagram'" public/assets/instagram.js
          ! grep -Fq 'vercel.app' public/assets/instagram.js
          grep -Fq 'handleInstagramDownload' src/index.ts
          grep -Fq 'url.pathname === "/api/download/instagram"' src/index.ts
          grep -Fq 'instagramDelivery: "cloudflare"' src/index.ts
          grep -Fq 'x-savedownloader-delivery' src/index.ts
          grep -Fq 'Download all (.zip)' public/assets/instagram.js
      - name: Check Instagram shares the provider layout
        run: |
          set -euo pipefail
          test -f public/instagram-downloader/index.html
          test -f public/assets/media-gallery.css
          grep -Fq '<section class="hero wrap" id="download">' public/instagram-downloader/index.html
          grep -Fq 'class="provider-title"' public/instagram-downloader/index.html
          grep -Fq 'class="hero-copy"' public/instagram-downloader/index.html
          grep -Fq 'class="tool"' public/instagram-downloader/index.html
          grep -Fq 'class="formrow"' public/instagram-downloader/index.html
          grep -Fq '/assets/media-gallery.css' public/instagram-downloader/index.html
          grep -Fq 'class="result media-result"' public/instagram-downloader/index.html
          grep -Fq 'data-media-gallery' public/instagram-downloader/index.html
          grep -Fq 'data-download-all' public/instagram-downloader/index.html
          ! grep -Fq 'instagram-hero' public/instagram-downloader/index.html
          ! grep -Fq 'instagram-hero' public/assets/instagram.js
          ! grep -Fq 'document.createElement('"'"'style'"'"')' public/assets/instagram.js
          ! grep -Eq '\.instagram[-_]' public/assets/media-gallery.css
      - name: Check core SEO and consent structure
        run: |
          set -euo pipefail
          pages=(
            public/index.html
            public/douyin-downloader/index.html
            public/tiktok-downloader/index.html
            public/instagram-downloader/index.html
            public/guides/index.html
            public/how-to-download-douyin-videos/index.html
            public/how-to-download-douyin-short-links/index.html
            public/how-to-download-tiktok-videos/index.html
            public/how-to-download-instagram-videos-and-photos/index.html
            public/contact/index.html
            public/privacy/index.html
            public/cookies/index.html
            public/terms/index.html
            public/copyright/index.html
          )
          for page in "${pages[@]}"; do
            test -f "$page"
            grep -Fq 'rel="canonical"' "$page"
            grep -Fq '<meta name="description"' "$page"
            grep -Fq '<meta name="robots" content="index,follow' "$page"
          done
          urls=(
            'https://savedownloader.com/'
            'https://savedownloader.com/douyin-downloader/'
            'https://savedownloader.com/tiktok-downloader/'
            'https://savedownloader.com/instagram-downloader/'
            'https://savedownloader.com/guides/'
            'https://savedownloader.com/how-to-download-douyin-videos/'
            'https://savedownloader.com/how-to-download-douyin-short-links/'
            'https://savedownloader.com/how-to-download-tiktok-videos/'
            'https://savedownloader.com/how-to-download-instagram-videos-and-photos/'
            'https://savedownloader.com/contact/'
            'https://savedownloader.com/privacy/'
            'https://savedownloader.com/cookies/'
            'https://savedownloader.com/terms/'
            'https://savedownloader.com/copyright/'
          )
          for url in "${urls[@]}"; do
            grep -Fq "<loc>${url}</loc>" public/sitemap.xml
          done
          grep -Fq 'Sitemap: https://savedownloader.com/sitemap.xml' public/robots.txt
          grep -Fq '<meta name="application-name" content="SaveDownloader">' public/index.html
          grep -Fq '<meta property="og:site_name" content="SaveDownloader">' public/index.html
          grep -Fq '"@type":"WebSite"' public/index.html
          grep -Fq '"name":"SaveDownloader"' public/index.html
          grep -Fq '"alternateName":["Save Downloader","savedownloader.com"]' public/index.html
          grep -Fq '/instagram-downloader/' public/index.html
          grep -Fq '/how-to-download-instagram-videos-and-photos/' public/index.html
          grep -Fq '/instagram-downloader/' public/guides/index.html
          grep -Fq '/how-to-download-instagram-videos-and-photos/' public/guides/index.html
          grep -Fq '/how-to-download-douyin-short-links/' public/guides/index.html
          grep -Fq 'v.douyin.com' public/how-to-download-douyin-short-links/index.html
          grep -Fq 'https://savedownloader.com/' README.md
          grep -Fq '/how-to-download-instagram-videos-and-photos/' public/instagram-downloader/index.html
          ! grep -Fqi 'preview version' public/instagram-downloader/index.html
          ! grep -Fqi 'scope of this preview' public/instagram-downloader/index.html
          grep -Fq 'contact@savedownloader.com' public/contact/index.html
          ! grep -Fq 'github.com/kevin4relocate/savedownloader/issues/new' public/contact/index.html
          grep -Fq 'sd_analytics_consent_v1' public/assets/analytics.js
          grep -Fq '/assets/consent.css' public/assets/analytics.js
          grep -Fq 'data-consent-settings' public/cookies/index.html
          test -f public/assets/consent.css
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            'public/index.html',
            'public/douyin-downloader/index.html',
            'public/tiktok-downloader/index.html',
            'public/instagram-downloader/index.html',
            'public/guides/index.html',
            'public/how-to-download-douyin-videos/index.html',
            'public/how-to-download-douyin-short-links/index.html',
            'public/how-to-download-tiktok-videos/index.html',
            'public/how-to-download-instagram-videos-and-photos/index.html'
          ];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = [...html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)];
            if (!blocks.length) throw new Error(`${file}: missing JSON-LD`);
            for (const block of blocks) JSON.parse(block[1]);
          }
          NODE
