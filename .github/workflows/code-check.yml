name: Code Check

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'test/**'
      - 'release/**'
      - 'fix/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Check browser JavaScript
        run: |
          node --check public/assets/app.js
          node --check public/assets/analytics.js
      - name: Check Vercel TikTok functions
        run: |
          node --check vercel-tiktok-api/api/health.js
          node --check vercel-tiktok-api/api/download.js
