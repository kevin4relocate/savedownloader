name: Vercel TikTok Backend Check

on:
  push:
    branches: [feature/vercel-tiktok-backend]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check serverless functions
        run: |
          node --check vercel-tiktok-api/api/health.js
          node --check vercel-tiktok-api/api/download.js
