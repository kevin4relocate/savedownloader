name: Inspect Public DouyinSaver Website Technology
on:
  push:
    branches: [test/douyinsaver-public-tech-inspection-20261019]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public homepage HTML and JS references
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          from html.parser import HTMLParser

          ORIGIN = 'https://douyinsaver.com/'
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[];self.forms=[];self.meta=[];self.inline=[];self.collect=False
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='script':
                      if d.get('src'):self.scripts.append(d['src'])
                      else:self.collect=True
                  if tag=='form':self.forms.append({'action':d.get('action'),'method':d.get('method')})
                  if tag=='meta' and d.get('name')=='generator':self.meta.append(d.get('content'))
              def handle_endtag(self,tag):
                  if tag=='script':self.collect=False
              def handle_data(self,data):
                  if self.collect:self.inline.append(data)
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/javascript,*/*'})
              with urllib.request.urlopen(req,timeout=18) as res:
                  return res.status,dict(res.headers),res.read(850000).decode('utf8','replace'),res.url
          try:
              status,headers,html,final=get(ORIGIN)
              print('HOMEPAGE:',{'status':status,'final':final,'size':len(html),'server':headers.get('Server'),'x-powered-by':headers.get('X-Powered-By'),'has-vercel-id':bool(headers.get('X-Vercel-Id')),'has-cf-ray':bool(headers.get('Cf-Ray'))})
          except Exception as e:
              print('HOMEPAGE ERROR:',type(e).__name__,str(e)[:120]);raise SystemExit(0)
          p=Parser();p.feed(html)
          print('META:',p.meta)
          print('FORMS:',p.forms[:8])
          print('SCRIPTS:',p.scripts[:22])
          markers=['__NEXT_DATA__','/_next/static/','/_nuxt/','astro-island','vite','react','alpine','htmx','webpack','/api/','cloudflare','vercel','supabase']
          print('HTML MARKERS:',[x for x in markers if x.lower() in html.lower()])
          domain=urllib.parse.urlsplit(final).netloc.lower()
          assets=[]
          for script in p.scripts:
              link=urllib.parse.urljoin(final,script)
              parts=urllib.parse.urlsplit(link)
              if parts.scheme=='https' and parts.netloc.lower()==domain and link not in assets:
                  assets.append(link)
              if len(assets)>=10:break
          paths=set();fetches=[]
          def scan(text,label):
              endpoints=re.findall(r'/(?:api|download|resolve|parse|extract|video|v1|v2|v3)/[a-zA-Z0-9/_\-.]+',text,re.I)
              for endpoint in endpoints:
                  if len(endpoint)<=125 and 'token' not in endpoint.lower() and 'secret' not in endpoint.lower():paths.add(endpoint)
              print('SOURCE:',label,'size:',len(text),'markers:',[x for x in ['/_next/','axios','fetch(','XMLHttpRequest','/api/','tikhub','rapidapi','supabase','cloudflare','astro-island'] if x.lower() in text.lower()])
              pattern=r"""(?:fetch|axios\.(?:get|post))\s*\(\s*["']([^"']{1,110})["']"""
              for val in re.findall(pattern,text,re.I)[:18]:
                  if '?' not in val and 'key' not in val.lower() and 'token' not in val.lower():
                      fetches.append((label,val))
          scan(html+'\n'+'\n'.join(p.inline),'HOME')
          for link in assets:
              label=urllib.parse.urlsplit(link).path[:105]
              try:
                  status,headers,text,finalurl=get(link)
                  if status==200:scan(text,label)
              except Exception as e:
                  print('SCRIPT_FETCH_FAILED:',label,type(e).__name__)
          print('ENDPOINT PATHS:',sorted(paths)[:65])
          print('FETCH LITERALS:',fetches[:40])
          PY
