name: Production Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://savedownloader.com
      PREVIEW_URL: https://savedownloader.nghiep4tube.workers.dev
      DOUYIN_ID: "7670405978537364745"
      DOUYIN_URL: "https://www.douyin.com/jingxuan?modal_id=7670405978537364745"
    steps:
      - name: Check production health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$BASE_URL/api/health" | tee /tmp/health.json
          node <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          process.exit(health?.version === '0.2.1' ? 0 : 1);
          NODE

      - name: Check indexable release pages
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            "/"
            "/douyin-downloader/"
            "/how-to-download-douyin-videos/"
            "/about/"
            "/contact/"
            "/privacy/"
            "/terms/"
            "/copyright/"
          )
          for path in "${pages[@]}"; do
            echo "Checking $path"
            html=$(curl -fsS --max-time 20 "$BASE_URL$path")
            grep -qi '<title>' <<<"$html"
            grep -qi 'name="description"' <<<"$html"
            grep -qi 'rel="canonical"' <<<"$html"
            grep -qi '<h1' <<<"$html"
            grep -Fqi '<script src="/assets/analytics.js" defer></script>' <<<"$html"
            if grep -Eqi 'name="robots"[^>]*content="[^"]*noindex' <<<"$html"; then
              echo "Unexpected HTML noindex on $path"
              exit 1
            fi
          done
          home=$(curl -fsS --max-time 20 "$BASE_URL/")
          grep -Fqi '<link rel="canonical" href="https://savedownloader.com/">' <<<"$home"

      - name: Check Google Analytics integration
        shell: bash
        run: |
          set -euo pipefail
          analytics=$(curl -fsS --max-time 20 "$BASE_URL/assets/analytics.js")
          grep -Fq 'G-07B50P20QM' <<<"$analytics"
          grep -Fq 'www.googletagmanager.com/gtag/js' <<<"$analytics"
          curl -fsSI --max-time 20 "$BASE_URL/" >/tmp/home.headers
          grep -Eqi '^content-security-policy:.*https://www\.googletagmanager\.com' /tmp/home.headers

      - name: Check Douyin-only public positioning
        shell: bash
        run: |
          set -euo pipefail
          html=$(curl -fsS --max-time 20 "$BASE_URL/")
          grep -qi 'Douyin' <<<"$html"
          if grep -Eqi 'TikTok|Instagram' <<<"$html"; then
            echo "Homepage should only advertise Douyin in this release."
            exit 1
          fi

      - name: Check security and indexing headers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSI --max-time 20 "$BASE_URL/" >/tmp/home.headers
          cat /tmp/home.headers
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' /tmp/home.headers
          grep -Eqi '^x-frame-options:[[:space:]]*DENY' /tmp/home.headers
          grep -Eqi '^referrer-policy:' /tmp/home.headers
          grep -Eqi '^permissions-policy:' /tmp/home.headers
          grep -Eqi '^content-security-policy:' /tmp/home.headers
          if grep -Eqi '^x-robots-tag:.*noindex' /tmp/home.headers; then
            echo "Custom production domain must be indexable."
            exit 1
          fi

          curl -fsSI --max-time 20 "$PREVIEW_URL/" >/tmp/preview.headers
          cat /tmp/preview.headers
          grep -Eqi '^x-robots-tag:.*noindex' /tmp/preview.headers

          curl -fsSI --max-time 20 "$BASE_URL/api/health" >/tmp/api.headers
          cat /tmp/api.headers
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' /tmp/api.headers
          grep -Eqi '^x-robots-tag:.*noindex' /tmp/api.headers

      - name: Check crawl assets and sitemap
        shell: bash
        run: |
          set -euo pipefail
          robots=$(curl -fsS --max-time 20 "$BASE_URL/robots.txt")
          grep -qi 'User-agent:' <<<"$robots"
          grep -qi 'Disallow: /api/' <<<"$robots"
          grep -qi 'Sitemap: https://savedownloader.com/sitemap.xml' <<<"$robots"

          sitemap=$(curl -fsS --max-time 20 "$BASE_URL/sitemap.xml")
          grep -qi '<urlset' <<<"$sitemap"
          for path in '' 'douyin-downloader/' 'how-to-download-douyin-videos/' 'about/' 'contact/' 'privacy/' 'terms/' 'copyright/'; do
            grep -Fq "https://savedownloader.com/$path" <<<"$sitemap"
          done

          curl -fsS --max-time 20 "$BASE_URL/favicon.svg" | grep -qi '<svg'
          curl -fsS --max-time 20 "$BASE_URL/site.webmanifest" | grep -qi 'SaveDownloader'

      - name: Check 404 behavior
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/not-found.html -w "%{http_code}" --max-time 20 "$BASE_URL/this-page-does-not-exist-release-check")
          test "$code" = "404"
          grep -qi 'noindex' /tmp/not-found.html
          grep -qi 'Page not found' /tmp/not-found.html

      - name: Check resolver rejects unsupported hosts
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resolve.json -w "%{http_code}" --max-time 20 \
            -H "content-type: application/json" \
            -d '{"url":"https://example.com/video/123"}' \
            "$BASE_URL/api/resolve")
          cat /tmp/resolve.json
          test "$code" = "422"
          grep -qi "not supported" /tmp/resolve.json

      - name: Check live Douyin resolver
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/douyin.json -w "%{http_code}" --max-time 30 \
            -H "content-type: application/json" \
            -d "{\"url\":\"$DOUYIN_URL\"}" \
            "$BASE_URL/api/resolve")
          cat /tmp/douyin.json
          test "$code" = "200"
          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/douyin.json", "utf8"));
            if (!payload.ok) throw new Error(payload.error || "Resolver returned ok=false");
            if (payload.data?.platform !== "douyin") throw new Error("Unexpected platform");
            if (payload.data?.id !== process.env.DOUYIN_ID) throw new Error("Unexpected Douyin post ID");
            if (!payload.data?.videoUrl && !(payload.data?.images?.length > 0)) throw new Error("No downloadable media URL returned");
            console.log(JSON.stringify({
              ok: true,
              platform: payload.data.platform,
              id: payload.data.id,
              type: payload.data.type,
              title: payload.data.title,
              author: payload.data.author,
              hasVideo: Boolean(payload.data.videoUrl),
              imageCount: payload.data.images?.length || 0
            }, null, 2));
          '
