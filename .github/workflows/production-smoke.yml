name: Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://savedownloader.nghiep4tube.workers.dev
      COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
      DOUYIN_ID: "7670405978537364745"
      DOUYIN_URL: "https://www.douyin.com/jingxuan?modal_id=7670405978537364745"
    steps:
      - name: Wait for active Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS --max-time 15 "$BASE_URL/api/health" >/tmp/health.json; then
              cat /tmp/health.json
              if node <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const deployedAt = Date.parse(health?.deployment?.timestamp || '');
          const commitAt = Date.parse(process.env.COMMIT_TIME || '');
          const currentEnough = Number.isFinite(deployedAt) && (!Number.isFinite(commitAt) || deployedAt >= commitAt);
          process.exit(health?.version === '0.2.0' && currentEnough ? 0 : 1);
          NODE
              then
                echo "Active Worker version is current enough for this commit."
                exit 0
              fi
            fi
            echo "Cloudflare has not activated this commit yet (attempt $i/30)"
            sleep 10
          done
          echo "Cloudflare deployment did not become current in time"
          exit 1

      - name: Check homepage
        run: |
          curl -fsS --max-time 20 "$BASE_URL/" | grep -qi "SaveDownloader"

      - name: Check Douyin landing page
        run: |
          curl -fsS --max-time 20 "$BASE_URL/douyin-downloader/" | grep -qi "Douyin"

      - name: Check robots and sitemap
        run: |
          curl -fsS --max-time 20 "$BASE_URL/robots.txt" | grep -qi "User-agent"
          curl -fsS --max-time 20 "$BASE_URL/sitemap.xml" | grep -qi "urlset"

      - name: Check resolver rejects unsupported hosts
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resolve.json -w "%{http_code}" --max-time 20 \
            -H "content-type: application/json" \
            -d '{"url":"https://example.com/video/123"}' \
            "$BASE_URL/api/resolve")
          cat /tmp/resolve.json
          test "$code" = "422"
          grep -qi "not supported" /tmp/resolve.json

      - name: Check live Douyin resolver
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/douyin.json -w "%{http_code}" --max-time 30 \
            -H "content-type: application/json" \
            -d "{\"url\":\"$DOUYIN_URL\"}" \
            "$BASE_URL/api/resolve")
          cat /tmp/douyin.json
          test "$code" = "200"
          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/douyin.json", "utf8"));
            if (!payload.ok) throw new Error(payload.error || "Resolver returned ok=false");
            if (payload.data?.platform !== "douyin") throw new Error("Unexpected platform");
            if (payload.data?.id !== process.env.DOUYIN_ID) throw new Error("Unexpected Douyin post ID");
            if (!payload.data?.videoUrl && !(payload.data?.images?.length > 0)) throw new Error("No downloadable media URL returned");
            console.log(JSON.stringify({
              ok: true,
              platform: payload.data.platform,
              id: payload.data.id,
              type: payload.data.type,
              title: payload.data.title,
              author: payload.data.author,
              hasVideo: Boolean(payload.data.videoUrl),
              imageCount: payload.data.images?.length || 0
            }, null, 2));
          '
