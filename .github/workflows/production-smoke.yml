name: Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://savedownloader.nghiep4tube.workers.dev
      DOUYIN_ID: "7670405978537364745"
      DOUYIN_URL: "https://www.douyin.com/jingxuan?modal_id=7670405978537364745"
    steps:
      - name: Wait for Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..18}; do
            if curl -fsS --max-time 15 "$BASE_URL/api/health" >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Deployment not ready yet (attempt $i/18)"
            sleep 10
          done
          echo "Production endpoint did not become healthy in time"
          exit 1

      - name: Check homepage
        run: |
          curl -fsS --max-time 20 "$BASE_URL/" | grep -qi "SaveDownloader"

      - name: Check Douyin landing page
        run: |
          curl -fsS --max-time 20 "$BASE_URL/douyin-downloader/" | grep -qi "Douyin"

      - name: Check robots and sitemap
        run: |
          curl -fsS --max-time 20 "$BASE_URL/robots.txt" | grep -qi "User-agent"
          curl -fsS --max-time 20 "$BASE_URL/sitemap.xml" | grep -qi "urlset"

      - name: Check resolver rejects unsupported hosts
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/resolve.json -w "%{http_code}" --max-time 20 \
            -H "content-type: application/json" \
            -d '{"url":"https://example.com/video/123"}' \
            "$BASE_URL/api/resolve")
          cat /tmp/resolve.json
          test "$code" = "422"
          grep -qi "not supported" /tmp/resolve.json

      - name: Check live Douyin resolver
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/douyin.json -w "%{http_code}" --max-time 30 \
            -H "content-type: application/json" \
            -d "{\"url\":\"$DOUYIN_URL\"}" \
            "$BASE_URL/api/resolve")
          cat /tmp/douyin.json
          if [ "$code" != "200" ]; then
            echo "Resolver failed; collecting safe SSR structure diagnostics..."
            UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.6 Mobile/15E148 Safari/604.1'
            curl -fsSL --max-time 30 \
              -A "$UA" \
              -H 'Referer: https://www.douyin.com/' \
              "https://www.iesdouyin.com/share/video/$DOUYIN_ID/?from_ssr=1" \
              -o /tmp/douyin-share.html
            node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/douyin-share.html', 'utf8');
          const match = html.match(/window\._ROUTER_DATA\s*=\s*([\s\S]*?)<\/script>/i);
          if (!match) {
            console.log('DIAG: _ROUTER_DATA not found; html bytes=', html.length);
            process.exit(0);
          }
          let raw = match[1].trim().replace(/;$/, '').trim();
          let data;
          try { data = JSON.parse(raw); } catch (e) {
            console.log('DIAG: JSON parse failed:', e.message, 'raw bytes=', raw.length);
            process.exit(0);
          }
          const loader = data?.loaderData;
          console.log('DIAG loaderData keys:', loader && typeof loader === 'object' ? Object.keys(loader) : []);
          if (loader && typeof loader === 'object') {
            for (const [key, value] of Object.entries(loader)) {
              const summary = {
                key,
                type: Array.isArray(value) ? 'array' : typeof value,
                keys: value && typeof value === 'object' ? Object.keys(value).slice(0, 50) : [],
                stringLength: typeof value === 'string' ? value.length : undefined,
                stringPrefix: typeof value === 'string' ? value.slice(0, 160) : undefined
              };
              console.log('DIAG loader entry:', JSON.stringify(summary));
              if (value && typeof value === 'object') {
                for (const [childKey, childValue] of Object.entries(value)) {
                  console.log('DIAG child:', JSON.stringify({
                    parent: key,
                    childKey,
                    type: Array.isArray(childValue) ? 'array' : typeof childValue,
                    keys: childValue && typeof childValue === 'object' ? Object.keys(childValue).slice(0, 40) : [],
                    value: ['number','boolean'].includes(typeof childValue) ? childValue : undefined
                  }));
                }
              }
            }
          }
          NODE
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("/tmp/douyin.json", "utf8"));
            if (!payload.ok) throw new Error(payload.error || "Resolver returned ok=false");
            if (payload.data?.platform !== "douyin") throw new Error("Unexpected platform");
            if (payload.data?.id !== process.env.DOUYIN_ID) throw new Error("Unexpected Douyin post ID");
            if (!payload.data?.videoUrl && !(payload.data?.images?.length > 0)) throw new Error("No downloadable media URL returned");
            console.log(JSON.stringify({ ok: true, platform: payload.data.platform, id: payload.data.id, type: payload.data.type, title: payload.data.title, author: payload.data.author, hasVideo: Boolean(payload.data.videoUrl), imageCount: payload.data.images?.length || 0 }, null, 2));
          '
